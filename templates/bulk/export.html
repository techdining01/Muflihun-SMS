{% extends 'base.html' %}
{% load static %}

{% block title %}Bulk Export - Admin Dashboard{% endblock %}

{% block content %}
<div class="py-4">
    <div class="mb-4">
        <h2 class="font-bold text-slate-900"><i class="bi bi-download"></i> Bulk Export</h2>
        <p class="text-slate-500">Export exam results and data.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <div class="bg-white rounded-2xl shadow-sm">
                <div class="p-4 border-b border-slate-200 bg-white">
                    <h5 class="font-semibold text-slate-900 mb-0">Export Exam Results</h5>
                </div>
                <div class="p-4">
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="export_type" value="results">
                        
                        <div class="mb-3">
                            <label for="exam_id" class="block text-sm font-medium text-slate-700 mb-1">Select Exam</label>
                            <select class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="exam_id" name="exam_id" required>
                                <option value="">Choose exam...</option>
                                {% for exam in exams %}
                                <option value="{{ exam.id }}">{{ exam.title }} ({{ exam.school_class.name }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Format</label>
                            <div class="flex items-center mb-2">
                                <input class="w-4 h-4 border-slate-300 rounded focus:ring-blue-500" type="radio" name="file_format" id="format_csv" value="csv" checked>
                                <label class="ml-2 text-slate-700" for="format_csv">CSV</label>
                            </div>
                            <div class="flex items-center">
                                <input class="w-4 h-4 border-slate-300 rounded focus:ring-blue-500" type="radio" name="file_format" id="format_xlsx" value="xlsx">
                                <label class="ml-2 text-slate-700" for="format_xlsx">Excel (XLSX)</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="bi bi-file-earmark-spreadsheet me-2"></i>Export Results
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
