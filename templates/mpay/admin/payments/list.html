{% extends "base.html" %}
{% block content %}
<div class="py-4">
    <h4 class="font-bold text-slate-900 mb-4">Payments</h4>

    <div class="bg-white rounded-2xl shadow-sm">
        <div class="overflow-x-auto p-0">
            <table class="w-full border-collapse align-middle table-responsive-stack">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-4 py-3 text-left font-semibold text-slate-700">Ref</th><th class="px-4 py-3 text-left font-semibold text-slate-700">Order</th><th class="px-4 py-3 text-left font-semibold text-slate-700">Amount</th><th class="px-4 py-3 text-left font-semibold text-slate-700">Status</th><th class="px-4 py-3 text-left font-semibold text-slate-700">Date</th>
                    </tr>
                </thead>
                <tbody>
                    {% for tx in transactions %}
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-4 py-3 text-slate-900">{{ tx.gateway_reference }}</td>
                        <td class="px-4 py-3 text-slate-700">#{{ tx.order.id }}</td>
                        <td class="px-4 py-3 text-slate-700">₦{{ tx.amount }}</td>
                        <td class="px-4 py-3 text-slate-700">{{ tx.status }}</td>
                        <td class="px-4 py-3 text-slate-700">{{ tx.created_at|date:"M d, Y" }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>  
    </div>  
</div>
{% endblock %}
