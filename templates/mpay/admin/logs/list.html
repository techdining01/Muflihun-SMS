{% extends "base.html" %}
{% block content %}
<div class="py-4">
    <h4 class="font-bold text-slate-900 mb-4">System Logs</h4>


    <div class="bg-white rounded-2xl shadow-sm">
        <div class="overflow-x-auto p-0">
            <table class="w-full border-collapse align-middle table-responsive-stack">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr><th class="px-4 py-3 text-left font-semibold text-slate-700">User</th><th class="px-4 py-3 text-left font-semibold text-slate-700">Action</th><th class="px-4 py-3 text-left font-semibold text-slate-700">Date</th></tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-4 py-3 text-slate-900">{{ log.user }}</td>
                        <td class="px-4 py-3 text-slate-700">{{ log.action }}</td>
                        <td class="px-4 py-3 text-slate-700">{{ log.created_at|date:"M d, Y H:i" }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
