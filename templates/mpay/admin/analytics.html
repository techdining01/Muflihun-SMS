{% extends "base.html" %}
{% load humanize %}
{% block title %}Revenue Analytics{% endblock %}

{% block content %}
<div class="py-4">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 mb-3">
    <h4 class="mb-0 text-slate-900 font-bold">Revenue Analytics</h4>

    <div class="flex flex-wrap gap-2">
      <a href="?range=7" class="px-3 py-1 text-sm {% if range_days == 7 %}bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors{% else %}border-2 border-blue-600 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition-colors{% endif %}">
        7 Days
      </a>
      <a href="?range=30" class="px-3 py-1 text-sm {% if range_days == 30 %}bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors{% else %}border-2 border-blue-600 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition-colors{% endif %}">
        30 Days
      </a>
      <a href="{% url 'mpay:export_revenue_csv' %}" class="px-3 py-1 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
        Export CSV
      </a>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm mb-4">
    <div class="p-4 text-center">
      <h6 class="text-slate-600">Total Revenue</h6>
      <h2 class="font-bold text-slate-900">₦{{ total_revenue|floatformat:2 }}</h2>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm">
    <div class="p-2 p-sm-3">
      <div style="overflow-x:auto;">
        <canvas id="revenueChart" height="120" style="min-width:320px;"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const ctx = document.getElementById("revenueChart");

  new Chart(ctx, {
    type: "line",
    data: {
      labels: {{ labels|safe }},
      datasets: [{
        label: "Revenue (₦)",
        data: {{ data|safe }},
        borderColor: "#2563eb",
        backgroundColor: "rgba(37,99,235,0.15)",
        tension: 0.35,
        fill: true,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      plugins: {
        tooltip: {
          callbacks: {
            label: function(ctx) {
              return "₦" + ctx.parsed.y.toLocaleString();
            }
          }
        }
      },
      scales: {
        y: {
          ticks: {
            callback: function(value) {
              return "₦" + value.toLocaleString();
            }
          }
        }
      }
    }
  });
});
</script>
{% endblock %}
