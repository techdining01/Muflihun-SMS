{% extends "base.html" %}
{% block content %}
<div class="py-4">

<h4 class="text-xl font-bold text-slate-900">Purchase History</h4>

<div class="overflow-x-auto">
    <table class="w-full border-collapse">
        <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Ref</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Ward</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Amount</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Status</th>
                <th class="px-4 py-3 text-left font-semibold text-slate-700">Action</th>
            </tr>
        </thead>

        <tbody>
            {% for o in orders %}
            <tr class="border-b border-slate-100 hover:bg-slate-50">
                <td class="px-4 py-3 text-slate-900">{{ o.transaction.reference|slice:":8" }}</td>
                <td class="px-4 py-3 text-slate-700">{{ o.ward.get_full_name }}</td>
                <td class="px-4 py-3 text-slate-700">₦{{ o.amount }}</td>
                <td class="px-4 py-3 text-slate-700">{{ o.status }}</td>
                <td class="px-4 py-3">
                    <a href="{% url 'mpay:receipt_pdf' o.transaction.id %}" class="px-3 py-1 border-2 border-blue-600 text-blue-600 rounded-lg text-sm hover:bg-blue-600 hover:text-white transition-colors">
                        Receipt
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</div>
{% endblock %}
