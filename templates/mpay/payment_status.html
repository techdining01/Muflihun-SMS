{% extends "base.html" %}
{% load static %}
{% block title %}Payment Status{% endblock %}

{% block content %}
<div class="py-5 text-center">
    <h3 class="text-2xl font-bold text-slate-900">Payment Status</h3>

    <div id="success" class="my-4"></div>
    <p id="status-text" class="text-slate-700">Verifying payment...</p>

    <div id="spinner" class="my-4">
        <img src="{% static 'images/spinner.gif' %}" alt="Loading..." width="100" height="70">
    </div>

    <div id="action-buttons" class="mt-3 hidden flex-wrap gap-2 justify-content-center">
      <a href="{% url 'mpay:select_ward' %}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        Buy more
      </a>
      <a href="{% url 'mpay:parent_orders' %}" class="px-4 py-2 border-2 border-blue-600 text-blue-600 rounded-lg hover:bg-blue-600 hover:text-white transition-colors">
        <i class="bi bi-bag-check"></i> View All Orders
      </a>
    </div>
</div>

<script>
const reference = "{{ transaction.gateway_reference|default:'' }}";

if (!reference) {
    document.getElementById("status-text").innerText = "Invalid transaction reference ❌";
    document.getElementById("spinner").style.display = "none";
    document.getElementById("action-buttons").classList.remove("hidden");
    document.getElementById("action-buttons").classList.add("flex");
    throw new Error("Missing transaction reference");
}

let attempts = 0;
const MAX_ATTEMPTS = 10; // 10 × 3s = 30 seconds max

function stopPolling() {
    clearInterval(interval);
    document.getElementById("spinner").style.display = "none";
    document.getElementById("action-buttons").classList.remove("hidden");
    document.getElementById("action-buttons").classList.add("flex");
}

function checkPayment() {
    attempts++;

    fetch("{% url 'mpay:payment_status_check' %}?ref=" + reference)
        .then(res => {
            if (res.status === 401) {
                window.location.href = "{% url 'accounts:login' %}?next=" + encodeURIComponent(window.location.pathname + window.location.search);
                throw new Error("Login required");
            }
            return res.json();
        })
        .then(data => {
            const successEl = document.getElementById("success");
            const statusEl = document.getElementById("status-text");

            if (data.verified === true) {
                successEl.innerHTML =
                    `<img src="https://cdn.dribbble.com/userupload/15097592/file/original-11af0dab65a0913fe4ea1d71d9d48f4a.gif" alt="success" width="120">`;
                statusEl.innerText = "Payment Successful ✓";
                stopPolling();

                setTimeout(() => {
                    window.location.href =
                        "{% url 'mpay:parent_orders' %}";
                }, 3000);
            }
            else if (data.status === "failed") {
                statusEl.innerText = "Payment Failed ❌";
                stopPolling();
            }
            else if (data.status === "abandoned") {
                statusEl.innerText = "Payment Abandoned ⚠️";
                stopPolling();
            }
            else if (attempts >= MAX_ATTEMPTS) {
                statusEl.innerText =
                    "Payment verification delayed. Please check your Orders page for updates.";
                stopPolling();
            }
            else {
                statusEl.innerText = "Verifying payment... (attempt " + attempts + "/" + MAX_ATTEMPTS + ")";
            }
        })
        .catch(err => {
            if (err.message === "Login required") return;
            console.error(err);
            document.getElementById("status-text").innerText =
                "Network error while verifying payment.";
            stopPolling();
        });
}

// poll every 3 seconds
const interval = setInterval(checkPayment, 3000);

// run immediately once
checkPayment();
</script>
{% endblock %}
