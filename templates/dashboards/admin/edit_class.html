{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Class{% endblock %}

{% block content %}
<div class="flex justify-center py-4">
    <div class="w-full max-w-2xl px-4">
        <div class="bg-white shadow-lg rounded-2xl">
            <div class="bg-blue-600 text-white px-6 py-4 rounded-t-2xl flex justify-between items-center">
                <h5 class="mb-0"><i class="bi bi-pencil-square mr-2"></i>Edit Class</h5>
                <a href="{% url 'dashboards:admin_delete_class' school_class.id %}" class="px-3 py-1.5 bg-red-600 text-white rounded-lg text-sm hover:bg-red-700 transition-colors" data-confirm="Are you sure you want to delete this class? This action cannot be undone.">
                    <i class="bi bi-trash"></i> Delete
                </a>
            </div>
            <div class="p-6">
                <form method="post">
                    {% csrf_token %}
                    {{form.as_p}}
                    
                    <div class="flex justify-between mt-6">
                        <a href="{% url 'dashboards:admin_classes_list' %}" class="px-4 py-2 bg-slate-600 text-white rounded-lg hover:bg-slate-700 transition-colors">Cancel</a>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="bi bi-save mr-2"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
