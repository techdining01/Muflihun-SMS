{% extends 'base.html' %}
{% load static %}

{% block title %}Students Management - Admin Dashboard{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2><i class="bi bi-people"></i> Students Management</h2>
        </div>
        <div class="col-md-4 text-end">
            <a href="{% url 'dashboards:admin_create_student' %}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Add Student
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <form method="get" class="row"
                  hx-get="{% url 'dashboards:admin_students_list' %}"
                  hx-target="#students-table-body"
                  hx-trigger="search, change from:.form-select, submit">
                <div class="col-md-6">
                    <input type="text" name="q" class="form-control" placeholder="Search students..." value="{{ search_query|default:'' }}"
                           hx-trigger="keyup changed delay:500ms">
                </div>
                <div class="col-md-3">
                    <select name="class" class="form-select">
                        <option value="">All Classes</option>
                        {% for class in classes %}
                            <option value="{{ class.id }}" {% if selected_class == class.id %}selected{% endif %}>{{ class.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-secondary w-100">Search</button>
                </div>
            </form>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 table-responsive-stack">
                <thead class="table-light">
                    <tr>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Class</th>
                        <th>Enrollment</th>
                        <th>Exams Taken</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="students-table-body">
                    {% include 'partials/dashboards/students_table_rows.html' %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
