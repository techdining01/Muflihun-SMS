{% extends 'base.html' %}

{% block title %}Delete Class{% endblock %}

{% block content %}
<div class="flex justify-center py-5">
    <div class="w-full max-w-md px-4">
        <div class="bg-white shadow-lg rounded-2xl border-2 border-red-200">
            <div class="bg-red-600 text-white px-6 py-4 rounded-t-2xl">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill mr-2"></i>Delete Class</h5>
            </div>
            <div class="p-6 text-center">
                <h4 class="text-xl font-bold text-slate-900 mb-4">Are you sure?</h4>
                <p class="text-lg text-slate-700 mb-4">You are about to delete the class <strong>"{{ class.name }}"</strong>.</p>
                <p class="text-slate-500 mb-4">This action cannot be undone. Any students assigned to this class will be unassigned.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="flex justify-center gap-3">
                        <a href="{% url 'dashboards:admin_classes_list' %}" class="px-6 py-3 bg-slate-600 text-white rounded-lg hover:bg-slate-700 transition-colors">Cancel</a>
                        <button type="submit" class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                            <i class="bi bi-trash-fill mr-2"></i>Yes, Delete Class
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
