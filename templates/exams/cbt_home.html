<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{{SCHOOL_NAME}}</title>

    <style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('../../static/images/background.jpg');
        background-position: center;
        background-size: cover;
        background-attachment: scroll;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    .school {
        color: rgba(246, 3, 3, 0.886);
        font-size: clamp(1.8rem, 6vw, 4rem);
    }

    img {
        width: clamp(120px, 40vw, 300px);
    }
</style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


</head>
<body>
    <img src="../../static/images/school_logo.png" alt="school logo" class="mb-3">

    <h1 class="school text-center mb-4">{{SCHOOL_NAME}}</h1>

    <div class="d-flex gap-3 flex-wrap justify-content-center">
        {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
        <a class="btn btn-warning" href="{% url 'accounts:dashboard_redirect' %}">Welcome back</a>
        {% else %}
        <a class="btn btn-primary" href="{% url 'accounts:register' %}">Register</a>
        <a class="btn btn-warning" href="{% url 'accounts:login' %}">Login</a>
        {% endif %}
    </div>
</body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
