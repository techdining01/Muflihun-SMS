{% extends "base.html" %}
{% load static %}

{% block title %}Server Error | Muflihun SMS{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="flex justify-center">
        <div class="w-full max-w-2xl">
            <div class="py-5">
                <h1 class="text-6xl font-bold text-red-600">500</h1>
                <h2 class="text-2xl font-semibold text-slate-900 mb-4">Internal Server Error</h2>
                <p class="text-slate-500 mb-5">
                    Something went wrong on our end. We've been notified and are looking into it. Please try again later.
                </p>
                <div class="flex justify-center gap-3">
                    <a href="{% url 'landing_page' %}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <i class="fas fa-home me-2"></i>Go Home
                    </a>
                    <button onclick="location.reload()" class="px-4 py-2 border-2 border-slate-300 text-slate-700 rounded-lg hover:bg-slate-100 transition-colors">
                        <i class="fas fa-sync me-2"></i>Retry
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
