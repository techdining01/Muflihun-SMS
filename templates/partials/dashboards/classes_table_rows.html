{% load static %}
<tbody>
    {% if classes %}
        {% for class in classes %}
        <tr>
            <td data-label="Class Name"><strong>{{ class.name }}</strong></td>
            <td data-label="Students"><span class="badge bg-info">{{ class.students.count }}</span></td>
            <td data-label="Exams"><span class="badge bg-secondary">{{ class.class_exam.count }}</span></td>
            <td data-label="Status">
                <span class="badge bg-success">Active</span>
            </td>
            <td data-label="Actions">
                <a href="{% url 'dashboards:admin_edit_class' class.id %}" class="btn btn-sm btn-outline-secondary" title="Edit">
                    <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger" title="Delete"
                        hx-post="{% url 'dashboards:admin_delete_class' class.id %}"
                        hx-confirm="Are you sure you want to delete this class?"
                        hx-target="closest tr"
                        hx-swap="outerHTML">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
        {% endfor %}
    {% else %}
    <tr>
        <td colspan="5" class="text-center text-muted py-4">
            No classes found
        </td>
    </tr>
    {% endif %}
</tbody>
