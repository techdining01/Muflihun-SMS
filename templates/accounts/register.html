{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-140px)] py-5">
    <div class="w-full max-w-lg px-4">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-lg border border-slate-100 p-6 md:p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-full inline-flex items-center justify-center mb-4 shadow-lg text-2xl mx-auto">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Join Our Community</h1>
                <p class="text-slate-500 text-sm">Create your account to get started</p>
            </div>

            {% if error %}
            <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <input type="text" name="username" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="floatingUsername" placeholder="Username" required>
                </div>

                <div class="mb-4">
                    <input type="email" name="email" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="floatingEmail" placeholder="Email" required>
                </div>

                <div class="mb-4">
                    <select name="role" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-slate-500" required>
                        <option value="">Select Your Role</option>
                        <option value="STUDENT">Student</option>
                        <option value="PARENT">Parent</option>
                        <option value="TEACHER">Teacher</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <div class="mb-4">
                    <input type="password" name="password1" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="floatingPassword" placeholder="Password" required>
                </div>

                <div class="mb-6">
                    <input type="password" name="password2" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="floatingConfirmPassword" placeholder="Confirm Password" required>
                </div>

                <button class="w-full px-4 py-3 bg-blue-600 text-white rounded-full font-bold shadow-md hover:bg-blue-700 transition-colors mb-4">
                    <i class="bi bi-check-circle mr-2"></i>Create Account
                </button>
            </form>

            <div class="border-t border-slate-200 pt-4 text-center">
                <p class="text-slate-500 text-sm">Already have an account?
                    <a href="{% url 'accounts:login' %}" class="text-blue-600 font-bold hover:text-blue-700 transition-colors">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
