{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center py-5">
  <div class="w-full max-w-md px-4">

    <div class="bg-white shadow-lg border-0 rounded-2xl p-6">

      <h4 class="text-center text-xl font-bold text-slate-900 mb-3">Complete Your Profile</h4>
      <p class="text-slate-500 text-center text-sm mb-6">
        Almost there — just a few more details
      </p>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
          <input name="phone_number" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-2">Address</label>
          <input name="address" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-2">Emergency Contact Name</label>
          <input name="emergency_contact" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-2">Emergency Contact Phone</label>
          <input name="emergency_phone" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-700 mb-2">Profile Picture</label>
          <input type="file" name="profile_picture" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <button class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors">
          Save & Continue
        </button>

      </form>

    </div>

  </div>
</div>
{% endblock %}
