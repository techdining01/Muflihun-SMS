{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center py-4">
    <div class="w-full max-w-sm px-4">
        <div class="bg-white shadow-sm rounded-2xl p-6">
            <h5 class="text-xl font-bold text-slate-900 mb-3">Reset Password</h5>
            <p class="text-slate-500 text-sm mb-4">User: {{ u.get_full_name }} ({{ u.role }})</p>
            <form method="post">{% csrf_token %}
                <input type="password" name="password" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-4" placeholder="New password" required>
                <button class="w-full px-4 py-3 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 transition-colors">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
