{% extends 'base.html' %}
{% block content %}
<div class="max-w-7xl mx-auto mt-4 px-4">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-900">Approve Users</h2>
        </div>
        <div>
            <a href="{% url 'dashboards:admin_dashboard' %}" class="px-4 py-2 bg-slate-600 text-white rounded-lg hover:bg-slate-700 transition-colors">Back to Dashboard</a>
        </div>
    </div>

    <form method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
            <label for="search" class="block text-sm font-medium text-slate-700 mb-2">Search</label>
            <input type="text" name="q" id="search" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Search name, email..." value="{{ request.GET.q }}">
        </div>
        <div>
            <label for="role" class="block text-sm font-medium text-slate-700 mb-2">Role</label>
            <select name="role" id="role" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">All Roles</option>
                {% for key, label in roles %}
                <option value="{{ key }}" {% if request.GET.role == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex items-end">
            <button class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Filter</button>
        </div>
    </form>

<form method="post">{% csrf_token %}
    <div class="overflow-x-auto">
        <table class="w-full border-collapse">
            <thead>
                <tr class="bg-slate-50 border-b border-slate-200">
                    <th class="px-4 py-3 text-left text-sm font-semibold text-slate-700"><input type="checkbox" onclick="toggleAll(this)"></th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-slate-700">Name</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-slate-700">Role</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-slate-700">Email</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold text-slate-700">Date Joined</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="px-4 py-3"><input type="checkbox" name="users" value="{{ u.id }}"></td>
                    <td class="px-4 py-3 text-slate-700">{{ u.username }}</td>
                    <td class="px-4 py-3"><span class="px-3 py-1 bg-slate-200 text-slate-700 rounded-full text-sm">{{ u.get_role_display }}</span></td>
                    <td class="px-4 py-3 text-slate-700">{{ u.email }}</td>
                    <td class="px-4 py-3 text-slate-700">{{ u.date_joined|date:"M d, Y" }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" class="px-4 py-8 text-center text-slate-500">No pending users</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <button class="mt-4 px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">Approve Selected</button>
</form>

<script>
    function toggleAll(source) {
        document.querySelectorAll('input[name="users"]').forEach(cb => cb.checked = source.checked)
    }
</script>
{% endblock %}
