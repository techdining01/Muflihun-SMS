{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-140px)] py-5">
    <div class="w-full max-w-md px-4">
        <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-lg border border-slate-100 p-6 md:p-8 text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-blue-600 text-white rounded-full inline-flex items-center justify-center mb-4 shadow-lg text-3xl">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
                <p class="text-slate-500 text-sm">Please sign in to your account</p>
            </div>

            {% if error %}
            <div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <input type="text" name="username" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="floatingInput" placeholder="Username" required>
                </div>

                <div class="mb-6">
                    <input type="password" name="password" class="w-full px-4 py-3 border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" id="floatingPassword" placeholder="Password" required>
                </div>

                <button class="w-full px-4 py-3 bg-blue-600 text-white rounded-full font-bold shadow-md hover:bg-blue-700 transition-colors mb-4">
                    <i class="bi bi-box-arrow-in-right mr-2"></i>Sign In
                </button>
            </form>

            <div class="border-t border-slate-200 pt-4">
                <p class="text-slate-500 text-sm">Don't have an account?
                    <a href="{% url 'accounts:register' %}" class="text-blue-600 font-bold hover:text-blue-700 transition-colors">Create Account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
