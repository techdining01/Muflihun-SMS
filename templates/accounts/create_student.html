{% extends 'base.html' %}
{% block content %}
<div class="flex justify-center py-4">
    <div class="w-full max-w-md px-4">
        <div class="bg-white shadow-lg rounded-2xl p-6">
            <h5 class="text-xl font-bold text-slate-900 mb-4">Register Student</h5>
            <form method="post">{% csrf_token %}
                {{ form.as_p }}
                <button class="w-full px-4 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors">Create Student</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
